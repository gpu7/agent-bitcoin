# Aperture L402 HTTP gateway + dummy origin (mainnet).
# Joins the existing AWS mainnet network; does not start LND.
#
# Requires: agent-payment-decision-lnd-mainnet Up on network agent-bitcoin-mainnet
#   docker compose -f docker-compose.l402.mainnet.yml up -d --build
#
# Public listener: host :8081 (restrict via security group to your Mac IP).
# Stop regtest/signet L402 first — same host port and container names.
# Do not name this container `aperture` — that name is Lightning Loop.

services:
  agent-l402-origin:
    build:
      context: ./l402
      dockerfile: Dockerfile.origin
    image: agent-bitcoin/l402-origin:mainnet
    container_name: agent-l402-origin
    restart: unless-stopped
    environment:
      L402_NETWORK: mainnet
    networks:
      - l402-net

  agent-l402-aperture:
    image: lightninglabs/aperture:v0.5.0
    container_name: agent-l402-aperture
    restart: unless-stopped
    depends_on:
      - agent-l402-origin
    ports:
      - "8081:8081"
    command: ["--configfile=/config/aperture.yaml"]
    volumes:
      - ./l402/aperture.mainnet.yaml:/config/aperture.yaml:ro
      - lnd-mainnet-data:/lnd:ro
      - l402-aperture-data:/root/.aperture
    networks:
      - l402-net

networks:
  l402-net:
    external: true
    name: agent-bitcoin-mainnet

volumes:
  lnd-mainnet-data:
    external: true
    name: agent-bitcoin_lnd-mainnet-data
  l402-aperture-data:
    name: agent-bitcoin_l402-aperture-mainnet
