# Signet LND on Mac (counterparty to AWS agent-payment-decision-lnd-signet).
# Neutrino — no full bitcoind. Separate volume from regtest.
#
# Usage:
#   docker compose -f docker-compose.signet.mac.yml up -d
#   Or: ./startup-signet-mac.sh
#
# If block_height stays 0 for 15–30+ min, see docs/signet.md "Mac Neutrino stuck".
#
# Host ports avoid regtest Mac (9736/10010) and AWS signet (19735/20009).

services:
  agent-bitcoin-lnd-signet:
    image: lightninglabs/lnd:v0.18.5-beta
    container_name: agent-bitcoin-lnd-signet
    restart: unless-stopped
    # Help DNS seed resolution inside Docker Desktop
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "29735:9735"
      - "30009:10009"
    command:
      - "--bitcoin.signet"
      - "--bitcoin.node=neutrino"
      # Force peers (stronger than addpeer). Update if they go stale.
      - "--neutrino.connect=192.241.222.63:38333"
      - "--neutrino.connect=45.79.76.218:38333"
      - "--neutrino.connect=130.41.131.84:38333"
      - "--neutrino.addpeer=192.241.222.63:38333"
      - "--neutrino.addpeer=45.79.76.218:38333"
      - "--lnddir=/home/lnd/.lnd"
      - "--listen=0.0.0.0:9735"
      - "--rpclisten=0.0.0.0:10009"
      - "--restlisten=0.0.0.0:8080"
      - "--debuglevel=info"
      - "--tlsextradomain=agent-bitcoin-lnd-signet"
    volumes:
      - agent-bitcoin-lnd-signet-data:/home/lnd/.lnd
    networks:
      - agent-signet-net

networks:
  agent-signet-net:
    driver: bridge

volumes:
  agent-bitcoin-lnd-signet-data:
