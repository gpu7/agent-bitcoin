name: Docker Build & Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build AWS image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: agent-bitcoin:awstest
          build-args: |
            TARGET=aws
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Non-blocking until we have a clean baseline; load:true makes image visible to Trivy
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'agent-bitcoin:awstest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
