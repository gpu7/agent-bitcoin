name: Docker Build & Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build AWS image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: agent-bitcoin:awstest
          build-args: |
            TARGET=aws
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Non-blocking until we have a clean baseline; load:true makes image visible to Trivy.
      # Pin to commit SHA (not a floating tag): March 2026 trivy-action tags were
      # rewritten in a supply-chain incident. 0.28.0 without the v prefix no longer
      # resolves. v0.36.0 is the current Aqua release after remediations.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'agent-bitcoin:awstest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
