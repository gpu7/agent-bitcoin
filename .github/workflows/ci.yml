name: CI - Lint & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      # Suppress deprecation warning
      - name: GitHub Actions - Node 20 Deprecation Notice
        run: |
          echo "⚠️  GitHub is deprecating Node.js 20."
          echo "   Our actions (checkout, setup-python, setup-uv) still declare it internally."
          echo "   They are running on Node 24. This warning is harmless."

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run Ruff
        run: uv run ruff check .

      # Prefer ruff format (same as pre-commit). Black and ruff-format can
      # disagree on assert wrapping; one formatter only avoids red CI.
      - name: Run Ruff format
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest
