services:
  agent-bitcoin-lnd:
    image: lightninglabs/lnd:v0.18.5-beta   # Matched to AWS version
    container_name: agent-bitcoin-lnd
    ports:
      - "9736:9735"     # Lightning P2P
      - "10010:10009"   # gRPC
    command:
      - "--bitcoin.regtest"
      - "--bitcoin.active"
      - "--bitcoin.node=bitcoind"
      - "--bitcoind.rpcuser=btc"
      - "--bitcoind.rpcpass=btc"
      - "--bitcoind.rpchost=54.91.201.125:18443"
      - "--bitcoind.zmqpubrawblock=tcp://54.91.201.125:28332"
      - "--bitcoind.zmqpubrawtx=tcp://54.91.201.125:28333"
      - "--lnddir=/home/lnd/.lnd"
      - "--listen=0.0.0.0:9735"
      - "--rpclisten=0.0.0.0:10009"
      - "--debuglevel=debug"
    volumes:
      - agent-bitcoin-lnd-data:/home/lnd/.lnd
    networks:
      - agent-lightning-net

networks:
  agent-lightning-net:
    driver: bridge

volumes:
  agent-bitcoin-lnd-data: