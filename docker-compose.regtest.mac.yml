services:
  agent-bitcoin-lnd:
    image: lightninglabs/lnd:v0.18.5-beta   # Matched to AWS version
    container_name: agent-bitcoin-lnd
    ports:
      - "9736:9735"     # Lightning P2P
      - "10010:10009"   # gRPC
    # REGTEST ONLY. Points at AWS bitcoind; weak RPC creds are regtest-only.
    command:
      - "--bitcoin.regtest"
      - "--bitcoin.active"
      - "--bitcoin.node=bitcoind"
      - "--bitcoind.rpcuser=lightning"
      - "--bitcoind.rpcpass=lightning"
      - "--bitcoind.rpchost=${AWS_IP}:18443"
      - "--bitcoind.zmqpubrawblock=tcp://${AWS_IP}:28332"
      - "--bitcoind.zmqpubrawtx=tcp://${AWS_IP}:28333"
      - "--lnddir=/home/lnd/.lnd"
      - "--listen=0.0.0.0:9735"
      - "--rpclisten=0.0.0.0:10009"
      - "--debuglevel=debug"
    volumes:
      - agent-bitcoin-lnd-data:/home/lnd/.lnd
    networks:
      - agent-lightning-net

networks:
  agent-lightning-net:
    driver: bridge

volumes:
  agent-bitcoin-lnd-data:
