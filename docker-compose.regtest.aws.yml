services:
  lnd:
    image: lightninglabs/lnd:v0.18.5-beta
    container_name: agent-payment-decision-lnd
    ports:
      - "9735:9735"
      - "10009:10009"
    command:
      - "--bitcoin.regtest"
      - "--bitcoin.active"
      - "--bitcoin.node=bitcoind"
      - "--bitcoind.rpcuser=rpcuser"          # ← Updated to Loop credentials
      - "--bitcoind.rpcpass=rpcpass"
      - "--bitcoind.rpchost=bitcoind:18443"
      - "--bitcoind.zmqpubrawblock=tcp://bitcoind:28332"
      - "--bitcoind.zmqpubrawtx=tcp://bitcoind:28333"
      - "--lnddir=/home/lnd/.lnd"
      - "--listen=0.0.0.0:9735"
      - "--rpclisten=0.0.0.0:10009"
      - "--debuglevel=debug"
      - "--externalip=${AWS_IP}"
    volumes:
      - lnd-data:/home/lnd/.lnd
    networks:
      - agent-net

networks:
  agent-net:
    external: true
    name: regtest_regtest

volumes:
  lnd-data:
