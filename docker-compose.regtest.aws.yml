services:
  agent-payment-decision-lnd:
    image: lightninglabs/lnd:v0.18.5-beta
    container_name: agent-payment-decision-lnd
    ports:
      - "9735:9735"
      - "10009:10009"
    # REGTEST ONLY. Weak bitcoind RPC creds are acceptable only on isolated regtest.
    # Do not reuse this compose file or these credentials for testnet/mainnet.
    command:
      - "--bitcoin.regtest"
      - "--bitcoin.active"
      - "--bitcoin.node=bitcoind"
      - "--bitcoind.rpcuser=lightning"
      - "--bitcoind.rpcpass=lightning"
      - "--bitcoind.rpchost=bitcoind:18443"
      - "--bitcoind.zmqpubrawblock=tcp://bitcoind:28332"
      - "--bitcoind.zmqpubrawtx=tcp://bitcoind:28333"
      - "--lnddir=/home/lnd/.lnd"
      - "--listen=0.0.0.0:9735"
      - "--rpclisten=0.0.0.0:10009"
      - "--debuglevel=debug"
      # SAN so loopd / other containers can dial agent-payment-decision-lnd:10009 over TLS
      - "--tlsextradomain=agent-payment-decision-lnd"
      - "--externalip=${AWS_IP}"
    volumes:
      - lnd-data:/home/lnd/.lnd
    networks:
      - agent-net

networks:
  agent-net:
    external: true
    name: regtest_regtest

volumes:
  lnd-data:
