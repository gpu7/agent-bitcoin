services:
  bitcoind:
    image: ruimarinho/bitcoin-core:latest
    container_name: bitcoind
    ports:
      - "18444:18444"
    command:
      - "bitcoind"
      - "-regtest"
      - "-server=1"
      - "-rpcuser=btc"
      - "-rpcpassword=btc"
      - "-rpcallowip=0.0.0.0/0"
      - "-rpcbind=0.0.0.0"
      - "-rpcport=18444"
      - "-printtoconsole"
      - "-zmqpubrawblock=tcp://0.0.0.0:28332"
      - "-zmqpubrawtx=tcp://0.0.0.0:28333"
    volumes:
      - bitcoin-data:/home/bitcoin/.bitcoin
    networks:
      - agent-net
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-regtest", "-rpcuser=btc", "-rpcpassword=btc", "getblockcount"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  lnd:
    image: lightninglabs/lnd:v0.18.5-beta
    container_name: agent-payment-decision-lnd
    depends_on:
      bitcoind:
        condition: service_healthy
    ports:
      - "9735:9735"
      - "10009:10009"
    command:
      - "--bitcoin.regtest"
      - "--bitcoin.active"
      - "--bitcoin.node=bitcoind"
      - "--bitcoind.rpcuser=btc"
      - "--bitcoind.rpcpass=btc"
      - "--bitcoind.rpchost=bitcoind:18444"
      - "--bitcoind.zmqpubrawblock=tcp://bitcoind:28332"
      - "--bitcoind.zmqpubrawtx=tcp://bitcoind:28333"
      - "--lnddir=/home/lnd/.lnd"
      - "--listen=0.0.0.0:9735"
      - "--rpclisten=0.0.0.0:10009"
      - "--debuglevel=debug"
    volumes:
      - lnd-data:/home/lnd/.lnd
    networks:
      - agent-net
    # Remove the extra_hosts line completely

networks:
  agent-net:
    driver: bridge

volumes:
  bitcoin-data:
  lnd-data:
