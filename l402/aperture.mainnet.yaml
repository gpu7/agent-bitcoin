# Aperture L402 gateway — mainnet.
# Distinct from Loop's container named `aperture` (port 11018).
# Uses invoice.macaroon only (Aperture default). Do not mount admin.macaroon.
listenaddr: "0.0.0.0:8081"
insecure: true
debuglevel: "info"
basedir: "/root/.aperture"
servestatic: false
strictverify: false
profile: 0

authenticator:
  network: "mainnet"
  disable: false
  lndhost: "agent-payment-decision-lnd-mainnet:10009"
  tlspath: "/lnd/tls.cert"
  macdir: "/lnd/data/chain/bitcoin/mainnet"

dbbackend: "sqlite"
sqlite:
  dbfile: "/root/.aperture/aperture.db"
  skipmigrations: false

hashmail:
  enabled: false

prometheus:
  enabled: false

services:
  # First match wins. This path is 100 sats (L402 invoice; SDK MIN_PAYMENT_SATS default is 100).
  - name: "mempool-feerate"
    hostregexp: ".*"
    pathregexp: "^/paid/finance/mempool-feerate$"
    address: "agent-l402-origin:8090"
    protocol: "http"
    price: 100
    timeout: 3600
  - name: "mempool-backlog"
    hostregexp: ".*"
    pathregexp: "^/paid/finance/mempool-backlog$"
    address: "agent-l402-origin:8090"
    protocol: "http"
    price: 100
    timeout: 3600
  - name: "fee-for-vsize"
    hostregexp: ".*"
    pathregexp: "^/paid/finance/fee-for-vsize$"
    address: "agent-l402-origin:8090"
    protocol: "http"
    price: 100
    timeout: 3600
  - name: "confirm-target"
    hostregexp: ".*"
    pathregexp: "^/paid/finance/confirm-target$"
    address: "agent-l402-origin:8090"
    protocol: "http"
    price: 100
    timeout: 3600
  - name: "btc-usd"
    hostregexp: ".*"
    pathregexp: "^/paid/finance/btc-usd$"
    address: "agent-l402-origin:8090"
    protocol: "http"
    price: 100
    timeout: 3600
  - name: "ln-path-fee-hint"
    hostregexp: ".*"
    pathregexp: "^/paid/finance/ln-path-fee-hint$"
    address: "agent-l402-origin:8090"
    protocol: "http"
    price: 100
    timeout: 3600
  - name: "ln-invoice-decode"
    hostregexp: ".*"
    pathregexp: "^/paid/finance/ln-invoice-decode$"
    address: "agent-l402-origin:8090"
    protocol: "http"
    price: 100
    timeout: 3600
  - name: "ln-invoice-preflight"
    hostregexp: ".*"
    pathregexp: "^/paid/finance/ln-invoice-preflight$"
    address: "agent-l402-origin:8090"
    protocol: "http"
    price: 100
    timeout: 3600
  - name: "l402-demo"
    hostregexp: ".*"
    pathregexp: "^/.*$"
    address: "agent-l402-origin:8090"
    protocol: "http"
    price: 1000
    timeout: 3600
    authwhitelistpaths:
      - "^/health$"
